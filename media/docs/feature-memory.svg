<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-label="三层记忆">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="939" height="329" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="42" y="44" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#111827">三层记忆：不用每次从头交代</text>
  <text x="42" y="66" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">全都存在本地，跟着插件走；卸载前不会上传任何内容</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="42" y="84" width="540" height="62" rx="8" fill="#f8fafc" stroke="#d7dce3"/>
    <text x="62" y="108" font-size="14" font-weight="600" fill="#111827">长期要求</text>
    <text x="62" y="130" font-size="12" fill="#4b5563">你手写的规矩：「改完跑一遍自测」「别动 dist/」——每轮都生效</text>

    <rect x="42" y="156" width="540" height="62" rx="8" fill="#eef4ff" stroke="#93b4f7"/>
    <text x="62" y="180" font-size="14" font-weight="600" fill="#1e40af">经验记忆</text>
    <text x="62" y="202" font-size="12" fill="#334155">工具报错后被修好，自动总结成一条；下次同类问题先命中它</text>

    <rect x="42" y="228" width="540" height="62" rx="8" fill="#f8fafc" stroke="#d7dce3"/>
    <text x="62" y="252" font-size="14" font-weight="600" fill="#111827">对话历史</text>
    <text x="62" y="274" font-size="12" fill="#4b5563">多会话存档，关掉页面再打开还在；超长时自动压缩而不是丢掉</text>
  </g>

  <line x1="590" y1="187" x2="618" y2="187" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar2)"/>

  <rect x="626" y="84" width="272" height="206" rx="8" fill="#fbfdff" stroke="#bfd3f6"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="762" y="116" font-size="14" font-weight="600" fill="#1e40af">拼进系统提示词</text>
    <text x="762" y="146" font-size="26" font-weight="700" fill="#111827">≈4K</text>
    <text x="762" y="166" font-size="12" fill="#6b7280">token（配置全拉满时）</text>
    <text x="762" y="196" font-size="12" fill="#4b5563">小模型也扛得住</text>
    <text x="762" y="216" font-size="12" fill="#4b5563">工具格式容错更好</text>
    <text x="762" y="236" font-size="12" fill="#4b5563">上下文超预算会压缩</text>
  </g>
</svg>
