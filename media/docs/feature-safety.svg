<svg xmlns="http://www.w3.org/2000/svg" width="940" height="350" viewBox="0 0 940 350" role="img" aria-label="安全门禁">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="939" height="349" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="42" y="42" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#111827">默认只读：想动你的文件，得先过门</text>
  <text x="42" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">门禁写在代码里，不是写在提示词里——模型怎么要求都绕不过去</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="42" y="92" font-size="12" font-weight="600" fill="#1e40af">写文件（insertText / saveText / createFile）</text>

    <rect x="42" y="100" width="214" height="48" rx="7" fill="#eef4ff" stroke="#93b4f7"/>
    <text x="149" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">硬约束</text>
    <text x="149" y="137" text-anchor="middle" font-size="11" fill="#334155">readOnly = false</text>

    <rect x="276" y="100" width="214" height="48" rx="7" fill="#eef4ff" stroke="#93b4f7"/>
    <text x="383" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">工具黑名单</text>
    <text x="383" y="137" text-anchor="middle" font-size="11" fill="#334155">insertText 不在 deniedTools</text>

    <rect x="510" y="100" width="214" height="48" rx="7" fill="#eef4ff" stroke="#93b4f7"/>
    <text x="617" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">路径限制</text>
    <text x="617" y="137" text-anchor="middle" font-size="11" fill="#334155">仅工作区内 · 非二进制 · ≤200KB</text>

    <line x1="728" y1="124" x2="750" y2="124" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar3)"/>
    <rect x="754" y="100" width="144" height="48" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="826" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">允许写入</text>

    <text x="42" y="188" font-size="12" font-weight="600" fill="#1e40af">执行命令（runCommand / PowerShell / CMD）</text>

    <rect x="42" y="196" width="214" height="48" rx="7" fill="#eef4ff" stroke="#93b4f7"/>
    <text x="149" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Shell 总开关</text>
    <text x="149" y="233" text-anchor="middle" font-size="11" fill="#334155">allowShell = true</text>

    <rect x="276" y="196" width="214" height="48" rx="7" fill="#eef4ff" stroke="#93b4f7"/>
    <text x="383" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">逐条确认</text>
    <text x="383" y="233" text-anchor="middle" font-size="11" fill="#334155">每条命令先弹窗问你</text>

    <rect x="510" y="196" width="214" height="48" rx="7" fill="#eef4ff" stroke="#93b4f7"/>
    <text x="617" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">失控保护</text>
    <text x="617" y="233" text-anchor="middle" font-size="11" fill="#334155">没输出 / 超时自动杀进程树</text>

    <line x1="728" y1="220" x2="750" y2="220" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar3)"/>
    <rect x="754" y="196" width="144" height="48" rx="7" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="826" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">执行命令</text>
  </g>

  <rect x="42" y="262" width="856" height="62" rx="8" fill="#f5f7fa" stroke="#e5e7eb"/>
  <text x="62" y="286" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">· 装好就是只读；写不写由标题下的「写入：只读 / 可写」一个按钮决定，不存在「勾了却不生效」的第二层开关</text>
  <text x="62" y="308" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">· 写入确认、命令确认各自独立；关掉会变成文字上的「关」，随时点回来，颜色不会误导你</text>
</svg>
