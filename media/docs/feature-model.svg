<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-label="模型可替换">
  <defs>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="939" height="329" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="42" y="42" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#111827">换个模型，不用改代码</text>
  <text x="42" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6b7280">只认 OpenAI 的 /chat/completions 协议；云端、本地、内网随便换</text>

  <rect x="42" y="104" width="150" height="72" rx="8" fill="#eef4ff" stroke="#93b4f7"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="117" y="132" font-size="14" font-weight="600" fill="#1e40af">Agent 循环</text>
    <text x="117" y="154" font-size="11" fill="#334155">不带任何内置端点</text>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="282" y="64" width="380" height="54" rx="7" fill="#f8fafc" stroke="#d7dce3"/>
    <text x="302" y="86" font-size="13" font-weight="600" fill="#111827">云端 OpenAI 兼容 API</text>
    <text x="302" y="105" font-size="11" fill="#6b7280">官方接口、中转站、公司代理都能填</text>

    <rect x="282" y="124" width="380" height="54" rx="7" fill="#f8fafc" stroke="#d7dce3"/>
    <text x="302" y="146" font-size="13" font-weight="600" fill="#111827">本地 GGUF 模型</text>
    <text x="302" y="165" font-size="11" fill="#6b7280">llama.cpp · LM Studio，断网也能用</text>

    <rect x="282" y="184" width="380" height="54" rx="7" fill="#f8fafc" stroke="#d7dce3"/>
    <text x="302" y="206" font-size="13" font-weight="600" fill="#111827">内网 / 自建服务</text>
    <text x="302" y="225" font-size="11" fill="#6b7280">同一套协议，改个地址和端口即可</text>
  </g>

  <line x1="194" y1="140" x2="276" y2="91" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar4)"/>
  <line x1="194" y1="140" x2="276" y2="151" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar4)"/>
  <line x1="194" y1="140" x2="276" y2="211" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ar4)"/>

  <rect x="690" y="64" width="208" height="174" rx="8" fill="#fbfdff" stroke="#bfd3f6"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="710" y="90" font-size="12" font-weight="600" fill="#1e40af">模型配置</text>
    <text x="710" y="112" font-size="11" fill="#4b5563">一套配置 = 地址 + Key</text>
    <text x="710" y="130" font-size="11" fill="#4b5563">+ 模型名 + 温度</text>
    <text x="710" y="156" font-size="11" fill="#4b5563">菜单里点一下切换，</text>
    <text x="710" y="174" font-size="11" fill="#4b5563">不用改 settings.json</text>
    <text x="710" y="202" font-size="11" fill="#9ca3af">换供应商也不改代码</text>
  </g>

  <text x="42" y="278" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">顶部那枚徽章会显示当前在用的模型名，一眼看出这次请求打到哪儿</text>
  <text x="42" y="300" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#4b5563">没有内置 Key、没有隐藏上报：插件只连你自己填的地址</text>
</svg>
