<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.55" stop-color="#111B33"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- circuit traces -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.4" opacity="0.38" stroke-linecap="round">
    <path d="M12 34h14l8-8h10"/>
    <path d="M12 46h9l6 6h7"/>
    <path d="M116 94h-14l-8 8h-10"/>
    <path d="M116 82h-9l-6-6h-7"/>
  </g>
  <g fill="#22D3EE" opacity="0.7">
    <circle cx="44" cy="26" r="2.1"/><circle cx="34" cy="52" r="2.1"/>
    <circle cx="84" cy="102" r="2.1"/><circle cx="94" cy="76" r="2.1"/>
  </g>
  <!-- hexagon core -->
  <path d="M64 20l38 22v44L64 108 26 86V42z" fill="none" stroke="url(#neon)" stroke-width="1.6" opacity="0.32"/>
  <path d="M64 28l31 18v36L64 100 33 82V46z" fill="none" stroke="url(#neon)" stroke-width="1" opacity="0.16"/>
  <!-- ZSZ seven-segment style -->
  <g fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter" filter="url(#glow)">
    <path d="M28 48H48L28 80H48"/>
    <path d="M74 48H54V64H74V80H54"/>
    <path d="M80 48H100L80 80H100"/>
  </g>
  <!-- scan accent -->
  <rect x="20" y="39" width="88" height="1.2" fill="#22D3EE" opacity="0.22"/>
</svg>
