<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120F"/>
      <stop offset="1" stop-color="#0A1F1A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- terminal window -->
  <rect x="16" y="26" width="96" height="76" rx="8" fill="#0B1A16" stroke="url(#neon)" stroke-width="1.8" opacity="0.95"/>
  <path d="M16 42h96" stroke="url(#neon)" stroke-width="1.4" opacity="0.5"/>
  <circle cx="27" cy="34" r="2.3" fill="#34D399"/>
  <circle cx="36" cy="34" r="2.3" fill="#22D3EE" opacity="0.7"/>
  <circle cx="45" cy="34" r="2.3" fill="#22D3EE" opacity="0.4"/>
  <!-- prompt caret -->
  <path d="M26 60h6l-6 6h6" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.5"/>
  <!-- ZSZ -->
  <g fill="none" stroke="url(#neon)" stroke-width="4.6" stroke-linecap="butt" stroke-linejoin="miter" filter="url(#glow)" transform="translate(0 6)">
    <path d="M48 54H62L48 78H62"/>
    <path d="M84 54H68V66H84V78H68"/>
    <path d="M88 54H102L88 78H102"/>
  </g>
  <!-- scanlines -->
  <g stroke="#34D399" stroke-width="0.6" opacity="0.10">
    <path d="M0 50h128M0 62h128M0 74h128M0 86h128M0 98h128"/>
  </g>
</svg>
