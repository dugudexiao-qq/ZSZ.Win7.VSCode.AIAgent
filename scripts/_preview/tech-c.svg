    <circle cx="64" cy="108" r="2.2" opacity="0.7"/><circle cx="21" cy="62" r="2.2" opacity="0.7"/>
  </g>
  <!-- ZSZ bold italic-ish -->
  <g fill="none" stroke="url(#neon)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
