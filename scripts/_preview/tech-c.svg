      <stop offset="0" stop-color="#1A1140"/>
      <stop offset="1" stop-color="#08060F"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
